<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR de la fila</title><link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#fff;color:#1c1c1e;font:18px Jost,sans-serif;text-align:center}h1{margin:0;font-size:42px;font-family:"Cormorant Garamond",serif;font-weight:600}#q{padding:16px;border:3px solid #b8903a;border-radius:20px}button{font:inherit;padding:12px 22px;border:0;border-radius:12px;background:#b8903a;color:#fff}@media print{button{display:none}}</style></head>
<body><img src="/logo.png" alt="Fausto Furlano Buti Barber Shop" style="width:150px;height:150px;border-radius:50%"><h1 id="n">Fausto Furlano Buti Barber Shop</h1><p>Escaneá, elegí barbero y anotate en la fila</p><div id="q"></div><button onclick="print()">Imprimir</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>fetch('/api/public').then(r=>r.json()).then(p=>{document.getElementById('n').textContent=p.name}).catch(()=>{});new QRCode(document.getElementById('q'),{text:location.origin+'/reservar/?modo=fila',width:260,height:260})</script></body></html>
